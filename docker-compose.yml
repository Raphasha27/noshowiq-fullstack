version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: NoShowIQ.API/Dockerfile
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ML_ENGINE_URL: http://ml_engine:8000
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      ml_engine:
        condition: service_started

  ml_engine:
    build:
      context: ./ml_engine
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ML_ENGINE_PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
      ML_ENGINE_URL: http://ml_engine:8000/predict
    depends_on:
      api:
        condition: service_started
