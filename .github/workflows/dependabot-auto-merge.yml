name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]'
    steps:
      - name: Wait for CI
        run: |
          gh pr checks "$PR_URL" --json name --jq 'length' >/dev/null 2>&1 || true
          if gh pr checks "$PR_URL" --json name --jq 'length' | grep -q '^[0-9]\+$'; then
            echo "CI checks detected, waiting for green..."
            gh pr checks "$PR_URL" --watch --required || { echo "CI not green, will retry on next sync"; exit 0; }
          else
            echo "No CI checks on this PR, proceeding directly"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}